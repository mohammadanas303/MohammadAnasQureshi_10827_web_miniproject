<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <div class="main" id="main">
        <div class="parent  ">
            <div style="display: flex;justify-content: center;"> <div id="opertor" style="text-align: center;;">Mohammad Anas Qureshi</div></div>
           
            <input type="text" class="input" ></input>
            <div class="flex">
                <div class="section1 center">
                    <div class="upper flex">
                        <button class="button_section1">a <sup>2</sup></button>
                        <button class="button_section1">a <sup>b</sup></button>
                        <button class="button_section1">|a|</button>
                    </div>
                    <div class="middle flex">
                        <button class="button_section1">√</button>
                        <button class="button_section1">∜</button>
                        <button class="button_section1">π</button>
                    </div>
                    <div class="lower flex">
                        <button class="button_section1">sin</button>
                        <button class="button_section1">cos</button>
                        <button class="button_section1">tan</button>
                    </div>
                    <div class="lower flex">
                        <button class="button_section1">(</button>
                        <button class="button_section1">)</button>
                        <button class="button_section1">,</button>
                    </div>
               </div>
                <div class="section2 center">
                    <div class="upper flex">
                        <button class="button_section2">7</button>
                        <button class="button_section2">8</button>
                        <button class="button_section2">9</button>
                        <button class="button_section2">/</button>
                    </div>
                    <div class="middle flex">
                        <button class="button_section2">4</button>
                        <button class="button_section2">5</button>
                        <button class="button_section2">6</button>
                        <button class="button_section2">*</button>
                    </div>
                    <div class="lower flex">
                        <button class="button_section2">1</button>
                        <button class="button_section2">2</button>
                        <button class="button_section2">3</button>
                        <button class="button_section2">-</button>
                    </div>
                    <div class="lower flex">
                        <button class="button_section2">0</button>
                        <button class="button_section2">.</button>
                        <button class="button_section2">%</button>
                        <button class="button_section2">+   </button>
                    </div>
                </div>
                <div class="section3">
                    <div class="upper flex">
                        <button class="button_section3">C</button>
                    </div>
                    <div class="middle flex">
                        <button class="button_section3">=</button>
                    </div>
                    </div>
            </div>


        </div>  
                <div id="cal" class="solgan"><div id="i">Let's Calculate...</div></div>
                
    </div>






    <script src="cal.js"></script>
</body>

</html>
